plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android { namespace 'com.ronin.ai'; compileSdk 35
    defaultConfig { applicationId 'com.ronin.ai'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0' }
    buildFeatures { compose true; buildConfig true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.14' }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'; implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
