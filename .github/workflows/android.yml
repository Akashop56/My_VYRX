name: Android build

on:
  pull_request:
    paths:
      - 'RONIN_Body_Kotlin/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main, arena/01a07f24-my-vyrx]
    paths:
      - 'RONIN_Body_Kotlin/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and assemble debug APK
        working-directory: RONIN_Body_Kotlin
        run: bash gradlew :app:assembleDebug --stacktrace
